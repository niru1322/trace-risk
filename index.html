<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>TRACE-RISK</title>
<style>body{background:#0a0a0a;color:#fff;font-family:Arial;padding:40px} .card{background:#1a1a1a;padding:20px;border-radius:12px;margin-top:20px} input{padding:12px;width:300px;border-radius:8px;border:none} button{padding:12px 20px;background:#00ff88;color:#000;border:none;border-radius:8px;margin-left:10px;cursor:pointer;font-weight:bold} .high{color:#ff4444} .low{color:#00ff88}</style>
</head><body>
<h1>🔍 TRACE-RISK - Corporate Risk Dashboard</h1>
<p>Enter company: TCS, IL&FS, INFOSYS</p>
<input id="c" placeholder="TCS"/><button onclick="check()">Check Risk</button>
<div id="out" class="card">Result will appear here...</div>
<script>
async function check(){
  const company = document.getElementById('c').value || 'TCS';
  const res = await fetch(`/api/risk?company=${company}`);
  const data = await res.json();
  document.getElementById('out').innerHTML = `<h2 class="${data.level==='HIGH'?'high':'low'}">${data.company} - ${data.risk_score}/100 ${data.level}</h2><p>${data.reason}</p><p><b>Directors:</b> ${data.directors.join(', ')}</p>`;
}
</script>
</body></html>
